name: Source compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1
      - run: python -m pip install -e .
      - name: Offline source and packaging checks
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: app
        run: |
          python app/tests/ci_smoke_test.py
          python -m unittest discover -s app/tests -p 'test_*.py' -v
