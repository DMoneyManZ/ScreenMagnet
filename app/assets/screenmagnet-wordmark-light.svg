    <path d="M13 35A8 8 0 0 1 21 43" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
    <path d="M13 28A15 15 0 0 1 28 43" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
