[project]
name = "screenmagnet"
version = "0.84"
description = "Cast this machine's screen to a TV over AirPlay, from the system tray."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6==6.11.1",
    "zeroconf==0.150.0",
]

[project.scripts]
screenmagnet = "screenmagnet.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "app" }

[tool.setuptools.packages.find]
where = ["app"]
include = ["screenmagnet*"]
